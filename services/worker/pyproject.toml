[project]
name = "codepilot-worker"
version = "0.1.0"
description = "CodePilot background worker + agent runtime"
requires-python = ">=3.11"
dependencies = [
    "codepilot-api",
    "celery[redis]==5.4.0",
    "docker==7.1.0",
    "pyyaml==6.0.2",
    "unidiff==0.7.5",
    "pathspec==0.12.1",
]

[project.optional-dependencies]
embeddings = ["fastembed==0.4.2"]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-env==1.1.5",
    "ruff==0.8.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.pytest.ini_options]
asyncio_mode = "auto"
env = ["ENV=test", "EMBEDDING_PROVIDER=hash", "LLM_PROVIDER=fake"]
