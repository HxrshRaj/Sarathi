name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (api + worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sarathi
          POSTGRES_PASSWORD: sarathi
          POSTGRES_DB: sarathi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sarathi" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      ENV: test
      DEV_AUTH_BYPASS: "true"
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: hash
      DATABASE_URL: postgresql+asyncpg://sarathi:sarathi@localhost:5432/sarathi_test
      DATABASE_URL_SYNC: postgresql+psycopg://sarathi:sarathi@localhost:5432/sarathi_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev,worker]"
          pip install -e "services/worker[dev]"
      - name: Lint
        run: ruff check apps/api/app services/worker/worker
      - name: Format check
        run: ruff format --check apps/api/app services/worker/worker
      - name: Type check (api)
        run: mypy apps/api/app || true
      - name: Migrate
        working-directory: apps/api
        run: alembic upgrade head
      - name: API tests
        working-directory: apps/api
        run: pytest -q
      - name: Re-migrate (api tests drop the schema on teardown)
        working-directory: apps/api
        run: alembic upgrade head
      - name: Worker tests
        working-directory: services/worker
        run: pytest -q

  frontend:
    name: frontend (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json — passing it
      # here as well makes action-setup@v4 error on the conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter sarathi-web run lint
      - run: pnpm --filter sarathi-web run typecheck
      - run: pnpm --filter sarathi-web run test
      - run: pnpm --filter sarathi-web run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - run: bandit -r apps/api/app services/worker/worker -q -ll
      - run: pip-audit -r apps/api/pyproject.toml || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -f infrastructure/docker/api.Dockerfile -t sarathi/api:ci .
          docker build -f infrastructure/docker/worker.Dockerfile -t sarathi/worker:ci .
          docker build -f infrastructure/docker/sandbox-python.Dockerfile -t sarathi/sandbox-python:ci .
