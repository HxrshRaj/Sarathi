[project]
name = "sarathi-api"
version = "0.1.0"
description = "Sarathi API — AI software engineering copilot with controlled autonomy"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "alembic==1.14.0",
    "greenlet==3.1.1",
    "structlog==24.4.0",
    "httpx==0.28.1",
    "cryptography==44.0.0",
    "redis==5.2.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.20",
    "tenacity==9.0.0",
    "unidiff==0.7.5",
    "anthropic==0.42.0",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
worker = [
    "celery[redis]==5.4.0",
    "docker==7.1.0",
    "fastembed==0.4.2",
    "pyyaml==6.0.2",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "pytest-env==1.1.5",
    "aiosqlite==0.20.0",
    "respx==0.22.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "types-pyyaml==6.0.12.20240917",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "SIM"]
ignore = [
    "S101",   # assert is used deliberately as an invariant guard + in tests
    "E501",   # line length is owned by `ruff format`
    "S105",   # false positives on non-secret config field defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"app/alembic/**" = ["E501", "S608"]  # migrations legitimately assemble DDL/DML strings

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `.` == apps/api at rootdir, so `from tests.conftest import ...` resolves even
# under setuptools' strict editable install (CI), where only `app` is on sys.path.
pythonpath = ["."]
addopts = "-ra --strict-markers"
env = ["ENV=test", "DEV_AUTH_BYPASS=true", "EMBEDDING_PROVIDER=hash", "LLM_PROVIDER=fake"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
